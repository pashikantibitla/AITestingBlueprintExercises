<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium to Playwright Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>⚡ Selenium → Playwright</h1>
        <div class="actions">
            <button id="convertBtn">Convert Code</button>
        </div>
    </header>

    <main>
        <div class="pane">
            <div class="pane-header">
                <span>JAVA SOURCE</span>
            </div>
            <textarea id="javaSource" placeholder="Paste your Selenium Java code here..." spellcheck="false"></textarea>
        </div>
        <div class="pane">
            <div class="pane-header">
                <span>TYPESCRIPT OUTPUT</span>
                <span id="filePath" style="font-size: 0.7em; opacity: 0.7;"></span>
            </div>
            <textarea id="tsOutput" placeholder="Converted code will appear here..." readonly
                spellcheck="false"></textarea>
        </div>
    </main>

    <div class="status-bar" id="statusBar">Ready</div>

    <script src="app.js"></script>
</body>

</html>
