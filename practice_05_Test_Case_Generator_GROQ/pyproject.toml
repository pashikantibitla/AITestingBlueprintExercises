[project]
name = "kimi-cli"
version = "0.1.0"
description = "A CLI tool for interacting with Moonshot AI's Kimi"
authors = [
    { name = "Antigravity", email = "antigravity@example.com" }
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]
requires-python = ">=3.11"

[project.scripts]
kimi = "kimi_cli.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
